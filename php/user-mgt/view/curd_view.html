<!DOCTYPE html>
<html lang="en">
<head>
    <title>AJAX CRUD Example</title>
</head>
<body>
    <h1>User Management (AJAX JSON)</h1>
    
    <!-- Status Message -->
    <p id="msg" style="color: green; font-weight: bold;"></p>

    <!-- Form for Create and Update -->
    <form id="crudForm">
        <!-- Hidden input to hold ID during an Update -->
        <input type="hidden" id="userId" value="">
        
        <label>Username:</label>
        <input type="text" id="username" value="">
        <br><br>
        
        <label>Email:</label>
        <input type="email" id="email" value="">
        <br><br>
        
        <input type="button" value="Save User" onclick="saveUser()">
    </form>

    <hr>

    <!-- Table for Read and Delete -->
    <table border="1" cellpadding="10" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="userTableBody">
            <!-- AJAX will inject rows here -->
        </tbody>
    </table>

    <script src="../asset/curd.js"></script>
</body>
</html>
